info:
  version: "1.0.0"
  name: "Cheshire OS Observability MCP"
  domain: "observability"
  organization: "Cheshire"
  contact: "halim.chaibi@gmail.com"
  environment: "${ENV:-local}"
  description: "OS and JVM metadata exposed through the Calcite OS adapter and MCP stdio."

capabilities:
  os:
    name: os
    description: "Read-only OS observability capability"
    domain: observability
    exposure: mcp-stdio
    transport: stdio
    sources:
      - os
    query-engine: calcite
    actions-specification-file: os-actions.yaml
    pipelines-definition-file: os-pipelines.yaml

sources:
  os:
    name: os
    type: os
    description: "Apache Calcite OS metadata adapter"
    config:
      type: os

query-engines:
  calcite:
    name: calcite
    description: "Calcite query engine with OS adapter source"
    factory: io.cheshire.query.engine.calcite.CalciteQueryEngineFactory
    sources:
      - os
    config:
      defaultLimit: 100
      maxLimit: 1000
      timeoutMs: 30000

exposures:
  mcp-stdio:
    type: mcp-stdio
    enabled: true
    binding: mcp-stdio
    execution: sync
    config:
      serverName: cheshire-os-observability

transports:
  stdio:
    port: 0
    host: local
    factory: io.cheshire.ServerFactory
