list_system_info:
  uri: /os/list_system_info
  description: "Fetch host-level system metadata from the Calcite OS adapter."
  input: io.cheshire.core.pipeline.MaterializedInput
  pipeline:
    preprocess:
      - name: identityInput
        type: transformer
        implementation: io.cheshire.core.pipeline.IdentityInputProcessor
    process:
      name: listSystemInfo
      type: executor
      implementation: io.cheshire.query.engine.calcite.pipeline.CalciteSqlExecutor
      template: |
        SELECT *
        FROM os.system_info
    postprocess:
      - name: identityOutput
        type: transformer
        implementation: io.cheshire.core.pipeline.IdentityOutputProcessor
  output: io.cheshire.core.pipeline.MaterializedOutput

